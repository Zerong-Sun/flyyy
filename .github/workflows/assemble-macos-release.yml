name: Assemble desktop release

on:
  push:
    branches: [codex/desktop-mobile-validation]
    paths: [.github/workflows/assemble-macos-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.4.0
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the completed chunk manifest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          ready=false
          for attempt in {1..180}; do
            if gh release download "$TAG" --pattern "WanliTrader-${TAG}-chunks.json" --dir "$RUNNER_TEMP/release" --clobber; then
              ready=true
              break
            fi
            sleep 30
          done
          if [ "$ready" != true ]; then
            echo "Chunk manifest not available" >&2
            exit 1
          fi
      - name: Download and verify shared release files
        shell: bash
        run: |
          gh release download "$TAG" --pattern "WanliTrader-${TAG}-*.part*" --dir "$RUNNER_TEMP/release" --clobber
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil
          root = Path(os.environ['RUNNER_TEMP']) / 'release'
          manifest = json.loads((root / f"WanliTrader-{os.environ['TAG']}-chunks.json").read_text())
          for kind in ('windows', 'macos_shell'):
              item = manifest[kind]
              output = root / item['name']
              with output.open('wb') as target:
                  for name in item['parts']:
                      with (root / name).open('rb') as part:
                          shutil.copyfileobj(part, target)
              with output.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              if digest != item['sha256']:
                  raise RuntimeError(f"Bad {kind} SHA-256: {digest}")
              print(f'Verified {kind}: {output.stat().st_size:,} bytes')
          PY
          done
      - name: Assemble and verify macOS app
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release/windows" "$RUNNER_TEMP/release/macos"
          unzip -q "$RUNNER_TEMP/release/WanliTrader-${TAG}-windows-x64.zip" -d "$RUNNER_TEMP/release/windows"
          unzip -q "$RUNNER_TEMP/release/WanliTrader-${TAG}-macos-shell.zip" -d "$RUNNER_TEMP/release/macos"
          cp "$RUNNER_TEMP/release/windows/windows/WanliTrader.pck" "$RUNNER_TEMP/release/macos/WanliTrader.app/Contents/Resources/万里行商.pck"
          codesign --verify --deep --strict "$RUNNER_TEMP/release/macos/WanliTrader.app"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          root = Path(os.environ['RUNNER_TEMP']) / 'release'
          app = root / 'macos/WanliTrader.app'
          archive = root / f"WanliTrader-{os.environ['TAG']}-macos-universal.zip"
          with ZipFile(archive, 'w', ZIP_DEFLATED, compresslevel=6) as output:
              for path in sorted(app.rglob('*')):
                  if path.is_file():
                      output.write(path, path.relative_to(app.parent).as_posix())
          print(f'Assembled {archive}: {archive.stat().st_size:,} bytes')
          PY
          unzip -tq "$RUNNER_TEMP/release/WanliTrader-${TAG}-macos-universal.zip"
      - name: Upload final assets and matching checksums
        shell: bash
        run: |
          cd "$RUNNER_TEMP/release"
          shasum -a 256 "WanliTrader-${TAG}-windows-x64.zip" "WanliTrader-${TAG}-macos-universal.zip" > "WanliTrader-${TAG}-SHA256SUMS.txt"
          gh release upload "$TAG" "WanliTrader-${TAG}-windows-x64.zip" "WanliTrader-${TAG}-macos-universal.zip" "WanliTrader-${TAG}-SHA256SUMS.txt" --clobber
