# Airline catalog with alliance membership (generic alliance labels — no trademark logos).
# alliance_id: star | oneworld | skyteam | none

alliances:
  - id: star
    name_zh: 星空联盟
    name_en: Star Alliance
  - id: oneworld
    name_zh: 寰宇一家
    name_en: oneworld
  - id: skyteam
    name_zh: 天合联盟
    name_en: SkyTeam
  - id: none
    name_zh: 独立承运
    name_en: Independent

# Curated airline metadata (alliance membership + home country). The authoritative
# airline catalog for flight synthesis is derived from OpenFlights airlines.dat;
# this file only layers alliance/hub metadata on top of the real operators.
# home_country uses ISO-3166-1 alpha-2 codes (matches airport.country_id).
airlines:
  - {id: DL, name: Delta Air Lines, alliance_id: skyteam, home_country: US}
