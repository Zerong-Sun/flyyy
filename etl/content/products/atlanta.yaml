    description: "佐治亚州因桃产量居全美前列而被昵称为'桃州'，亚特兰大市中心的桃树街更是将这一身份写入了地图。这款软糖以浓缩桃汁和果胶制成，咀嚼时释放出明显的蜜桃香气和淡淡酸味。密封保存可维持软糯质地三个月，高温潮湿环境会使糖粒粘连，建议夹层隔纸包装。"

