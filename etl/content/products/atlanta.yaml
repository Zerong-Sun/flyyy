    description: "亚特兰大是马丁·路德·金博士的故乡和民权运动的策源地之一。这本读本收录了从蒙哥马利巴士抵制到1964年民权法案签署的关键事件照片与演讲稿摘录。英文原文搭配插画地图，适合对20世纪美国社会史感兴趣的读者。纸质封面建议使用硬壳书套防压。"

