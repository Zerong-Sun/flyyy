    description: "美国南方棉花种植历史可追溯至殖民时期，今天佐治亚州仍是东南部优质棉产地之一。这条围巾以长绒棉纺制的细纱平纹织成，手感柔软贴肤，染色采用桃树街两侧老橡树的深绿为主色调。折叠后仅占手帕大小的行李空间，四季皆宜。"

