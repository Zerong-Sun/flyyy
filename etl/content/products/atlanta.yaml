    reference_currency: "USD"
    shelf_life_hours: 1800
    fragility: 0.0
    rarity: 0.5
    description: "乔治亚州是美国山核桃（Pecan）产量第一的州，南方阳光和红土共同赋予了这种坚果饱满的油脂香气。经低温烘烤后以海盐和枫糖调味，酥脆而不油腻。坚果富含不饱和脂肪酸，在干燥凉爽的条件下可保存约两个半月，是长途飞行中高能量密度的零食伴侣。"

  - product_id: "atl_civil_rights_book"
