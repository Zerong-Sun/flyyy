    category: "纺织品"
    weight_kg: 0.15
    base_reference_price: 38.0
    reference_currency: "USD"
    shelf_life_hours: 99999
    fragility: 0.0
    rarity: 0.45
    description: "巴黎高级时装屋的设计师每年创作数以千计的丝巾图案——从1900年代的博物学版画到当代街头艺术。这条丝巾以14姆米斜纹真丝为底，双面数码印花将蒙马特的石板路与杜乐丽花园的几何苗圃抽象为色块拼贴。重量极轻、折叠体积极小，但单价和品牌溢价使单位行李利润高得惊人。"

  - product_id: "cdg_cafe_bowl"
    name_zh: "咖啡馆碗"
    category: "陶瓷"
    weight_kg: 0.45
    base_reference_price: 18.0
    reference_currency: "USD"
    shelf_life_hours: 99999
    fragility: 0.1
    rarity: 0.25
    description: "法国咖啡馆每天早晨供应牛奶咖啡（Café au Lait）的容器通常是这种无把手的宽口碗——方便将可颂浸入咖啡而不会溢出。碗体外壁施以不规则的米白釉，底部留一圈未经上釉的素烧陶土，还原了传统窑厂的简朴审美。手工拉坯痕迹在每一次转盘的停顿中留下微妙的指纹。"

  - product_id: "cdg_sketchbook"
    name_zh: "素描本"
    category: "文具"
    weight_kg: 0.3
    base_reference_price: 14.0
    reference_currency: "USD"
    shelf_life_hours: 99999
    fragility: 0.0
    rarity: 0.2
    description: "巴黎的艺术材料商店——如Sennelier在塞纳河左岸的百年老店——至今仍在以19世纪的配方研磨颜料。这本素描本的封皮为法国Arches手工纸厂生产的160g/m²冷压水彩纸，纸面粗糙度正好抓住炭笔的每一粒粉尘。A5开本适合街头速写的大小，绑带可扣住铅笔不散落。"
