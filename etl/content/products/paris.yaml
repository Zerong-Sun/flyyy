    description: "巴黎马卡龙以双层杏仁蛋白饼加上甘纳许或果酱夹心构成，外壳在指尖轻压时应发出细微的碎裂声，内部则是略带嚼劲的湿润感。礼盒含6种经典风味：开心果、玫瑰、香草、焦糖、柠檬和巧克力。极度易碎且保质期仅10天左右——必须在行李中单独用气泡膜包裹并减少中转时间。"

  - product_id: "cdg_lavender_soap"
    name_zh: "薰衣草皂"
    category: "日用品"
    weight_kg: 0.2
    base_reference_price: 12.0
    reference_currency: "USD"
    shelf_life_hours: 4800
    fragility: 0.0
    rarity: 0.3
    description: "普罗旺斯的夏季—瓦朗索勒高原上的薰衣草田在6月下旬进入盛花期，空气中油脂浓度高到连蜜蜂都放慢了翅膀频率。这款冷制皂以当地冷榨薰衣草精油和碾碎的花蕾浸泡橄榄油为基底，泡沫细腻温和。薰衣草本身具有抗菌性，天然防腐使皂体在干燥空气中可存放半年以上。"

  - product_id: "cdg_scarf_print"
