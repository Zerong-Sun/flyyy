products:
  - product_id: "sin_kaya_jam"
    name_zh: "咖椰酱"
    category: "食品"
    weight_kg: 0.4
    base_reference_price: 12.0
    reference_currency: "USD"
    shelf_life_hours: 1200
    fragility: 0.0
    rarity: 0.4
    description: "咖椰酱（Kaya）是娘惹饮食文化中流出的甜味宝藏——以新鲜椰奶、鸭蛋和班兰叶在文火上不停搅拌约2小时直至浓稠顺滑，颜色从淡绿过渡为焦糖棕。涂在烤至金黄的吐司上再夹一片冷藏黄油，这就是新加坡人早餐桌上雷打不动的Kaya Toast。玻璃瓶密封可保存约7周，开瓶后需冷藏。"

  - product_id: "sin_pineapple_tart"
    name_zh: "黄梨塔"
    category: "食品"
    weight_kg: 0.35
    base_reference_price: 11.0
    reference_currency: "USD"
    shelf_life_hours: 720
    fragility: 0.1
    rarity: 0.35
    description: "凤梨酥在新加坡和马来西亚的春节盘盒中从不缺席，烘烤时黄油的焦香飘满整条组屋走廊。酥皮以大量黄油制成极短的松化结构，入口在舌面崩塌为粉状；内馅以慢熬凤梨酱浓缩至焦糖色，保留了果肉纤维的咀嚼感。酥皮娇嫩易碎，运输途中需在盒内以隔板分隔每个塔防止互相挤压。"

  - product_id: "sin_batik_pouch"
    name_zh: "峇迪布袋"
    category: "纺织品"
    weight_kg: 0.2
    base_reference_price: 17.0
    reference_currency: "USD"
    shelf_life_hours: 99999
    fragility: 0.0
    rarity: 0.3
    description: "峇迪（Batik）是以蜡染技术绘制图案后分段浸染的织物工艺，在印度尼西亚和马来西亚的文化中被列为人类非物质文化遗产。这款布袋以棉布为底，以铜印章（Canting Cap）复刻爪哇飞鸟和藤蔓纹样，棕、蓝和白的天然靛蓝与苏木染料呈现出有机色斑。拉链布袋适合收纳化妆品、充电线等旅行零碎。"

  - product_id: "sin_orchid_soap"
    name_zh: "兰花香氛皂"
    category: "日用品"
    weight_kg: 0.18
    base_reference_price: 10.0
    reference_currency: "USD"
    shelf_life_hours: 4800
    fragility: 0.0
    rarity: 0.25
    description: "新加坡国家胡姬花园保有超过3000个兰花栽培品种，其中以卓锦万代兰为国花。这款香皂以椰油和棕榈油皂化后加入兰花提取物和香草精油，泡沫丰富但冲洗后不残留滑腻感。干燥状态下香氛可保持超过半年——与大多数手工皂相比有更长的气味半衰期，是做礼物而非自用的典型品类。"

  - product_id: "sin_merlion_magnet"
    name_zh: "鱼尾狮磁贴"
    category: "纪念品"
    weight_kg: 0.05
    base_reference_price: 5.0
    reference_currency: "USD"
    shelf_life_hours: 99999
    fragility: 0.0
    rarity: 0.1
    description: "鱼尾狮是新加坡旅游局在1964设计的城市象征——狮头代表传说中苏门答腊王子在新加坡看到的狮子，鱼身纪念渔村的起源。这座8.6米高的雕塑自1972年起坐落在滨海湾，口中不停喷水入海。磁贴以PVC软胶注模上色，指甲盖大小，几乎不产生行李负担。"
