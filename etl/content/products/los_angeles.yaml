products:
  - product_id: "lax_citrus_candy"
    name_zh: "柑橘软糖"
    category: "糖果"
    weight_kg: 0.35
    base_reference_price: 9.0
    reference_currency: "USD"
    shelf_life_hours: 1800
    fragility: 0.0
