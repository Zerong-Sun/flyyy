    description: "以软珐琅填充的金属徽章描绘了洛杉矶的终极图标——棕榈树剪影和落日橙粉色渐变。直径约3厘米，背面为蝶形扣针，可固定在帆布背包或牛仔夹克上。极轻极小的体积使其成为填满行李任何缝隙的完美商品，几乎不产生运输成本。"
