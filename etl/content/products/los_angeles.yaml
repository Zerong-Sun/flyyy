    base_reference_price: 14.0
    reference_currency: "USD"
    shelf_life_hours: 99999
    fragility: 0.0
    rarity: 0.2
    description: "好莱坞是世界电影工业的中心——以洛杉矶的山丘为名称起源。这款海报精选1930至1960年代好莱坞黄金时期的经典影片海报，以微喷技术在高克重哑光纸上还原原版的色彩饱和度与半色调网点。纸筒装运，打开后有轻微卷曲，夹在书堆下压一晚即可平整挂墙。"

  - product_id: "lax_almond_snack"
    name_zh: "加州杏仁零食"
    category: "食品"
    weight_kg: 0.4
    base_reference_price: 11.0
    reference_currency: "USD"
    shelf_life_hours: 2000
    fragility: 0.0
    rarity: 0.3
    description: "全球约80%的杏仁产自加利福尼亚中央山谷。清晨的冷水灌溉和夏季的干热风共同塑造了这种坚果的高油分和脆度。这批杏仁经高温瞬时烘烤以减少水分、锁住油脂，调以迷迭香和海盐碾碎的外壳——地中海与太平洋的口味在加州交汇。高油脂含量在真空密封状态下可保存约三个月。"

  - product_id: "lax_enamel_pin"
