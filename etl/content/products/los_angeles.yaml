    category: "纺织品"
    weight_kg: 0.35
    base_reference_price: 18.0
    reference_currency: "USD"
    shelf_life_hours: 99999
    fragility: 0.0
    rarity: 0.25
    description: "加州冲浪文化自1960年代Jan and Dean的音乐传向世界之后，帆布袋就成了南加州生活方式最方便的外销产品。以10oz帆布缝制，印有经典长板冲浪板轮廓和日落渐变色。容量可装下笔记本电脑、沙滩巾和一本书，肩带长度适合肩背和斜挎两用。"

  - product_id: "lax_film_poster"
