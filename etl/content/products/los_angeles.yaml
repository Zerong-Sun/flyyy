    description: "南加州地中海气候孕育了全美最优质的柑橘产区。这款糖果以瓦伦西亚橙和尤里卡柠檬的真实果汁为基底，外层裹上细砂糖粒后冷风干燥，形成咬开时清脆的砂糖壳和内部柔韧的果汁凝胶。干燥凉爽环境下可保存两个半月。在亚热带和热带地区几乎没有柑橘种植的气候条件，糖果成了携带阳光的介质。"

  - product_id: "lax_surf_tote"
