products:
  - product_id: "can_chenpi"
    name_zh: "新会陈皮"
    category: "食品"
    weight_kg: 0.25
    base_reference_price: 20.0
    reference_currency: "USD"
    shelf_life_hours: 4800
    fragility: 0.0
    rarity: 0.5
    description: "广东新会区特产的大红柑皮经过三蒸三晒后入罐陈化，时间从三年到三十年不等。陈化五年以上的陈皮颜色从橙红转为棕黑，果香收敛为沉厚的药香和木质辛香。广东家庭在煲汤和蒸鱼时投入一两瓣即可提鲜去腥。年份越久价格越高，十年陈皮的市场价值远超等重新鲜柑橘。防潮密封罐装可无限期保存。"

  - product_id: "can_herbal_tea"
    name_zh: "凉茶配方茶包"
    category: "茶叶"
    weight_kg: 0.2
    base_reference_price: 10.0
    reference_currency: "USD"
    shelf_life_hours: 3600
    fragility: 0.0
    rarity: 0.3
    description: "广东人对抗亚热带湿热的武器之一即是凉茶——以夏枯草、金银花、菊花、鸡蛋花和罗汉果等十余味中草药配伍。茶包以袋装形式提供，直接以沸水冲泡即可，无需传统砂锅慢熬的繁琐工序。在非岭南地区，凉茶的文化认知度较低但好奇心驱动的首次购买意愿远高于传统茶叶。"

  - product_id: "can_canton_pastry"
    name_zh: "广式点心礼盒"
    category: "食品"
    weight_kg: 0.6
    base_reference_price: 14.0
    reference_currency: "USD"
    shelf_life_hours: 480
    fragility: 0.1
    rarity: 0.35
    description: "广式早茶的蒸笼文化以虾饺为封面故事——澄面皮晶莹透亮至隐约可见内部粉嫩虾仁的轮廓。蛋挞的外皮数以十层折叠的酥皮在烤箱中膨胀为千层结构。保质期极短——虾饺冷冻后可维持鲜味约三周，但即使在亚洲城市间，点心对时效性的高要求也使其成为一种隐含着航空物流能力的贸易挑战。"

  - product_id: "can_silk_fan"
    name_zh: "粤绣团扇"
    category: "工艺品"
    weight_kg: 0.2
    base_reference_price: 28.0
    reference_currency: "USD"
    shelf_life_hours: 99999
    fragility: 0.0
    rarity: 0.35
    description: "粤绣（广绣）是中国四大名绣之一，以针法丰富和色彩艳丽见长。这把团扇的扇面在白色真丝底布上以劈丝绣技法将一根丝线劈为16股细线后平绣荔枝——岭南佳果的粗糙果皮和莹白果肉的质感对比仅在方寸扇面之间完成。竹制扇柄有一节自然竹节保留。在海外中华文化圈中，广绣团扇是高级节礼。"

  - product_id: "can_ceramic_spoon"
    name_zh: "广彩瓷勺"
    category: "陶瓷"
    weight_kg: 0.15
    base_reference_price: 12.0
    reference_currency: "USD"
    shelf_life_hours: 99999
    fragility: 0.1
    rarity: 0.25
    description: "广彩是清代广州作为唯一对外通商口岸时期为适应外销市场需求而发展出的釉上彩工艺——以金线和织地纹为背景的玫瑰、牡丹和凤凰构成'满工'的华丽视觉效果。这把瓷勺以白瓷素坯在700°C左右的低温中烧制釉上彩纹，金线边缘的反射在光线中微微闪烁。在西方古董市场上，广彩属于成熟的收藏品类。"
